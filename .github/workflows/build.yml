name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Preparar la firma
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/hola.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/hola.jks" >> $GITHUB_ENV

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk hola-apk.apk
          gh release create "v${{ github.run_number }}" hola-apk.apk --repo ${{ github.repository }} --title "Versión ${{ github.run_number }}" --notes "Compilado automático"
